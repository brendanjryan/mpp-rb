plugins:
  - rubocop-minitest
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

Metrics/MethodLength:
  Max: 80

Metrics/ClassLength:
  Max: 300

Metrics/ModuleLength:
  Max: 200

Metrics/AbcSize:
  Max: 80

Metrics/CyclomaticComplexity:
  Max: 25

Metrics/PerceivedComplexity:
  Max: 25

Metrics/ParameterLists:
  Max: 10

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "mpp.gemspec"

Naming/MethodParameterName:
  AllowedNames:
    - id
    - n
    - to
    - a
    - b

Naming/PredicateMethod:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

Style/Documentation:
  Enabled: false

Minitest/MultipleAssertions:
  Enabled: false

# Data.define members named :method are intentional (matching the protocol spec)
Lint/DataDefineOverride:
  Enabled: false

# Multiple test helper classes in one file is fine for tests
Style/OneClassPerFile:
  Exclude:
    - "test/**/*"
